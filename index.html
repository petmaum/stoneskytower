<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>예쁘게 하늘 탑 쌓기</title>
<meta name="theme-color" content="#5d9cf5">
<meta name="description" content="블록을 타이밍 맞춰 쌓아 하늘 끝까지! 한 손으로 즐기는 탑 쌓기 게임">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* VOICE: 가볍고 경쾌한 캐주얼 게임, 한 손으로 바로 시작
   IDEA: 하늘로 쌓아 올리는 장난감 블록 탑 — 높이 쌓을수록 낮→노을→밤하늘
   PICTURE: 게임 화면 자체(폰 비율 캔버스), 둥근 하우징 안에
   COLOUR and TYPE: 하늘색 그라디언트 + 사탕색 블록, 강조 코랄; Jua
   LAYOUT: 작은 제목 → 게임 → 한 줄 안내, 폰에서는 화면 꽉 채움 */
:root{color-scheme:light dark;--bg:light-dark(#eaf6ff,#0d1426);--ink:light-dark(#10223a,#e8f0ff);--sub:light-dark(#4a6283,#9fb3d6);--acc:#ff6b5a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Jua",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:460px;margin:0 auto;padding:16px 14px 28px;display:flex;flex-direction:column;gap:12px}
h1{font-size:clamp(22px,7vw,32px);line-height:1.05;margin:0;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top{display:flex;justify-content:space-between;align-items:end;gap:12px}
.best{color:var(--sub);font-size:16px;white-space:nowrap}
#box{position:relative;width:100%;height:min(74vh,700px);min-height:440px;border-radius:28px;overflow:hidden;
  box-shadow:0 0 0 6px light-dark(#fff,#1b2540),0 18px 40px -12px rgba(16,34,58,.45);touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(10,20,40,.35);backdrop-filter:blur(2px)}
#ov.hide{display:none}
.card{background:#fff;color:#10223a;border-radius:24px;padding:24px 22px;width:100%;max-width:320px;text-align:center;box-shadow:0 20px 40px -10px rgba(0,0,0,.4)}
.card h2{font-size:30px;line-height:1.1;margin:0 0 6px;font-weight:400}
.card p{margin:0 0 16px;color:#4a6283;font-size:16px}
.big{font-size:52px;line-height:1;margin:4px 0 2px}
.btn{display:block;width:100%;min-height:52px;border:0;border-radius:16px;font:inherit;font-size:18px;cursor:pointer;margin-top:10px}
.btn:focus-visible{outline:3px solid #10223a;outline-offset:2px}
.pri{background:var(--acc);color:#fff}
.sec{background:#e8eef6;color:#10223a}
.ad{background:#10223a;color:#fff}
.ad .tag{display:inline-block;background:#ffd84d;color:#10223a;border-radius:8px;padding:2px 10px;font-size:14px;margin-bottom:10px}
.ad p{color:#9fb3d6}
.note{color:var(--sub);font-size:14px;margin:0;text-align:center}
.vs{display:inline-block;background:#fff1c2;color:#7a5400;border-radius:10px;padding:4px 12px;font-size:15px;margin-bottom:8px}
.rank{list-style:none;margin:0 0 6px;padding:0;text-align:left;max-height:300px;overflow-y:auto}
.rank li{display:grid;grid-template-columns:2em 1fr auto auto;gap:8px;align-items:center;padding:9px 6px;border-bottom:1px solid #eef2f7;font-size:17px}
.rank li.me{background:#fff4f2;border-radius:12px;color:#d6402f}
.rank .n{color:#8aa0bd;text-align:center}.rank .sc{white-space:nowrap}
.mini{min-height:36px;padding:0 12px;border:0;border-radius:10px;background:#e8eef6;color:#10223a;font:inherit;font-size:14px;cursor:pointer}
.mini:focus-visible{outline:3px solid #10223a}
.small{font-size:13px;color:#8aa0bd;margin:6px 0 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row2 .btn{margin-top:10px}
@media(max-width:600px){.wrap{padding:10px 10px 18px}#box{height:calc(100svh - 120px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>예쁘게 하늘 탑 쌓기</h1><div class="best">최고 <span id="bestTop">0</span>층</div></div>
  <div id="box">
    <canvas id="cv"></canvas>
    <div id="ov"></div>
  </div>
  <p class="note">화면을 탭하거나 스페이스바를 누르세요</p>
</div>
<script>
{
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),box=document.getElementById('box'),ov=document.getElementById('ov'),bestTop=document.getElementById('bestTop');
let W=0,H=0,dpr=1,s=1,VH=100;
const BH=7,BASEW=56;
let state='ready',blocks=[],cur=null,falls=[],cam=0,camT=0,combo=0,continued=false,flash=0,lastMiss=null,overTimer=0,popText='',popT=0;
const STORE=true;
let challenge=null,passed=false;
const PLAYERS=[['민지',42],['준호',35],['서연',28],['도윤',21],['하은',17],['지우',12],['현우',8]];
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function board(){const list=PLAYERS.map(([n,sc])=>({n,sc,me:false}));list.push({n:'나',sc:best,me:true});list.sort((a,b)=>b.sc-a.sc||(a.me?-1:1));return list;}
function myRank(){return board().findIndex(p=>p.me)+1;}
let best=0;try{best=+localStorage.getItem('skytower-best')||0}catch(e){}
bestTop.textContent=best;

function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=box.clientWidth;H=box.clientHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);s=W/100;VH=H/s;}
const ro=new ResizeObserver(resize);ro.observe(box);resize();

const ground=()=>VH*0.14;
const yOf=hTop=>VH-ground()-hTop+cam;
const hue=i=>(i*11+200)%360;

function reset(){blocks=[{x:(100-BASEW)/2,w:BASEW,i:0}];falls=[];cam=camT=0;combo=0;continued=false;spawn();}
function spawn(){const n=blocks.length,top=blocks[n-1],w=top.w,left=n%2===1;
  cur={x:left?-w*0.35:100-w*0.65,w,i:n,dir:left?1:-1};}
function speed(){return Math.min(36+blocks.length*1.3,92);}

function drop(){
  if(state!=='play'||!cur)return;
  const top=blocks[blocks.length-1];
  let L=Math.max(cur.x,top.x),R=Math.min(cur.x+cur.w,top.x+top.w),ov=R-L;
  if(ov<=0){falls.push({x:cur.x,w:cur.w,h:(cur.i+1)*BH,vy:0,i:cur.i,r:0,vr:cur.dir*1.5});lastMiss=cur;cur=null;state='falling';overTimer=0.75;return;}
  if(Math.abs(cur.x-top.x)<1.6){
    combo++;let x=top.x,w=top.w;
    if(combo>=3&&w<BASEW){const g=Math.min(4,BASEW-w);w+=g;x=Math.max(0,x-g/2);}
    blocks.push({x,w,i:cur.i});flash=1;popText=combo>=2?'퍼펙트 x'+combo:'퍼펙트!';popT=1;
  }else{
    combo=0;
    if(cur.x<L)falls.push({x:cur.x,w:L-cur.x,h:(cur.i+1)*BH,vy:0,i:cur.i,r:0,vr:-2});
    if(cur.x+cur.w>R)falls.push({x:R,w:cur.x+cur.w-R,h:(cur.i+1)*BH,vy:0,i:cur.i,r:0,vr:2});
    blocks.push({x:L,w:ov,i:cur.i});
  }
  if(challenge&&!passed&&blocks.length-1>challenge.sc){passed=true;popText=challenge.n+' 추월!';popT=1.3;flash=1;}
  spawn();
}

function lerp(a,b,t){return a+(b-a)*t}
function hex(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
const SKY=[['#7cc8ff','#d8f1ff'],['#5d9cf5','#bfe3ff'],['#ff9a76','#ffd9a8'],['#4b3f8f','#e98a8a'],['#141b45','#3b3a7a'],['#060a24','#18204d']];
function sky(){const t=Math.min((blocks.length-1)/14,SKY.length-1.001),k=Math.floor(t),f=t-k;
  const mix=(a,b)=>{const A=hex(a),B=hex(b);return`rgb(${A.map((v,j)=>Math.round(lerp(v,B[j],f))).join(',')})`};
  return[mix(SKY[k][0],SKY[k+1][0]),mix(SKY[k][1],SKY[k+1][1]),t];}

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);}
function drawBlock(b,y,alpha=1){
  const X=b.x*s,Y=y*s,Wd=b.w*s,Hd=BH*s,hh=hue(b.i);
  ctx.globalAlpha=alpha;
  ctx.fillStyle=`hsl(${hh} 75% 58%)`;rr(X,Y,Wd,Hd,Math.min(6,Wd/4));ctx.fill();
  ctx.fillStyle=`hsl(${hh} 85% 74%)`;rr(X+2,Y+2,Math.max(0,Wd-4),Hd*0.28,4);ctx.fill();
  ctx.fillStyle=`hsl(${hh} 60% 42%)`;ctx.fillRect(X+3,Y+Hd-3,Math.max(0,Wd-6),2);
  ctx.globalAlpha=1;
}

const clouds=Array.from({length:14},(_,k)=>({x:(k*37)%100,h:30+k*42,sz:8+(k*7)%9}));
const stars=Array.from({length:60},(_,k)=>({x:(k*53.7)%100,y:(k*31.3)%100}));

function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const[c1,c2,t]=sky();
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(t>3.2){ctx.fillStyle=`rgba(255,255,255,${Math.min(1,(t-3.2))*0.8})`;for(const st of stars){ctx.fillRect(st.x*s,(st.y/100)*H*0.8,2,2);}}
  ctx.fillStyle=t>3?'rgba(255,255,255,.18)':'rgba(255,255,255,.75)';
  for(const c of clouds){const y=yOf(c.h)+cam*0.5-cam;const Y=(VH-ground()-c.h+cam*0.55)*s;if(Y<-60||Y>H+60)continue;
    const X=c.x*s,r=c.sz*s;ctx.beginPath();ctx.ellipse(X,Y,r*1.6,r*0.6,0,0,7);ctx.ellipse(X+r*0.8,Y-r*0.35,r*0.9,r*0.6,0,0,7);ctx.ellipse(X-r*0.7,Y-r*0.2,r*0.8,r*0.5,0,0,7);ctx.fill();}
  // ground hill
  const gy=yOf(0)*s;
  if(gy<H+10){ctx.fillStyle=t>3?'#2b4a3a':'#6cc06a';ctx.beginPath();ctx.moveTo(0,gy+6);ctx.quadraticCurveTo(W/2,gy-18,W,gy+6);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
    ctx.fillStyle=t>3?'#22392e':'#4fa452';ctx.fillRect(0,gy+18,W,H);}
  for(const b of blocks){const y=yOf((b.i+1)*BH);if(y*s>H+40||y*s<-40)continue;drawBlock(b,y);}
  if(challenge){const ly=yOf((challenge.sc+1)*BH)*s;if(ly>-20&&ly<H+20){
    ctx.save();ctx.setLineDash([8,6]);ctx.lineWidth=2;ctx.strokeStyle=passed?'rgba(255,255,255,.45)':'#ffd84d';ctx.beginPath();ctx.moveTo(0,ly);ctx.lineTo(W,ly);ctx.stroke();ctx.setLineDash([]);
    const label=challenge.n+' '+challenge.sc+'층';ctx.font='15px Jua, sans-serif';const tw=ctx.measureText(label).width+16;
    ctx.fillStyle=passed?'rgba(255,255,255,.5)':'#ffd84d';rr(W-tw-8,ly-24,tw,22,8);ctx.fill();ctx.fillStyle='#10223a';ctx.textAlign='left';ctx.fillText(label,W-tw,ly-8);ctx.restore();}}
  if(cur){drawBlock(cur,yOf((cur.i+1)*BH));}
  for(const f of falls){const y=yOf(f.h);ctx.save();ctx.translate((f.x+f.w/2)*s,(y+BH/2)*s);ctx.rotate(f.r);ctx.translate(-(f.x+f.w/2)*s,-(y+BH/2)*s);drawBlock(f,y,0.9);ctx.restore();}
  if(flash>0&&blocks.length>1){const b=blocks[blocks.length-1],y=yOf((b.i+1)*BH),e=(1-flash)*4;
    ctx.strokeStyle=`rgba(255,255,255,${flash})`;ctx.lineWidth=3;rr((b.x-e)*s,(y-e)*s,(b.w+e*2)*s,(BH+e*2)*s,8);ctx.stroke();}
  if(state!=='ready'){
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,0,0,.25)';ctx.shadowBlur=8;
    ctx.font=`${Math.round(Math.min(64,W*0.16))}px Jua, sans-serif`;ctx.fillText(blocks.length-1,W/2,H*0.13);
    if(popT>0){ctx.globalAlpha=popT;ctx.font=`${Math.round(Math.min(28,W*0.07))}px Jua, sans-serif`;ctx.fillStyle='#fff6b0';ctx.fillText(popText,W/2,H*0.13+40-(1-popT)*14);ctx.globalAlpha=1;}
    ctx.shadowBlur=0;
  }
}

let last=performance.now();
function loop(now){
  const dt=Math.min(0.04,(now-last)/1000);last=now;
  if(state==='play'&&cur){cur.x+=cur.dir*speed()*dt;const lo=-cur.w*0.35,hi=100-cur.w*0.65;if(cur.x<lo){cur.x=lo;cur.dir=1}if(cur.x>hi){cur.x=hi;cur.dir=-1}}
  for(const f of falls){f.vy+=260*dt;f.h-=f.vy*dt;f.r+=f.vr*dt;}
  falls=falls.filter(f=>yOf(f.h)<VH+20);
  camT=Math.max(0,(blocks.length+1)*BH+ground()-VH*0.58);cam+=(camT-cam)*Math.min(1,dt*6);
  if(flash>0)flash=Math.max(0,flash-dt*2.5);if(popT>0)popT=Math.max(0,popT-dt*1.4);
  if(state==='falling'){overTimer-=dt;if(overTimer<=0)gameOver();}
  draw();requestAnimationFrame(loop);
}

function show(html){ov.innerHTML=html;ov.classList.remove('hide');}
function hide(){ov.classList.add('hide');ov.innerHTML='';}
function ready(){state='ready';challenge=null;reset();show(`<div class="card"><h2>예쁘게 하늘 탑 쌓기</h2><p>블록이 아래 블록과 겹칠 때 탭!<br>딱 맞추면 퍼펙트, 3연속이면 블록이 다시 넓어져요.</p>
  <button class="btn pri" data-a="start">시작하기</button>
  ${STORE?'':`<div class="row2"><button class="btn sec" data-a="rank">순위 보기</button><button class="btn sec" data-a="inbox">도전장 1</button></div>`}</div>`);}
function start(){hide();passed=false;state='play';}
function rankView(back){
  const rows=board().map((p,k)=>`<li class="${p.me?'me':''}"><span class="n">${k+1}</span><span>${esc(p.n)}</span><span class="sc">${p.sc}층</span>${p.me?'<span></span>':`<button class="mini" data-a="vs" data-n="${esc(p.n)}" data-s="${p.sc}">대결</button>`}</li>`).join('');
  show(`<div class="card"><h2>친구 순위</h2><ul class="rank">${rows}</ul><p class="small">예시 데이터 · 출시 버전은 토스 게임센터 순위로 연결돼요</p><button class="btn sec" data-a="${back}">돌아가기</button></div>`);
}
function inbox(){show(`<div class="card"><span class="vs">도전장 도착</span><h2>도윤님이 도전장을 보냈어요</h2><p>“내 21층 넘을 수 있어?”</p><button class="btn pri" data-a="vs" data-n="도윤" data-s="21">도전 받기</button><button class="btn sec" data-a="home">나중에</button><p class="small">예시 화면</p></div>`);}
function vs(n,sc){challenge={n,sc:+sc};reset();show(`<div class="card"><span class="vs">대결</span><h2>${esc(n)}님의 ${sc}층을 넘어라</h2><p>노란 선이 상대 기록이에요.</p><button class="btn pri" data-a="go">대결 시작</button><button class="btn sec" data-a="home">취소</button></div>`);}
function sent(){show(`<div class="card"><span class="vs">보냈어요</span><h2>도전장을 보냈어요</h2><p>친구가 ${blocks.length-1}층을 넘으면 알려드릴게요.</p><p class="small">예시 화면 · 출시 버전은 토스 친구 공유로 보내고, 친구가 들어오면 보상을 줄 수 있어요</p><button class="btn pri" data-a="again">다시 하기</button><button class="btn sec" data-a="home">처음으로</button></div>`);}
function gameOver(){
  state='over';const sc=blocks.length-1,nb=sc>best;if(nb){best=sc;try{localStorage.setItem('skytower-best',best)}catch(e){}bestTop.textContent=best;}
  const head=challenge?(sc>challenge.sc?`<span class="vs">승리! ${esc(challenge.n)}님 ${challenge.sc}층 돌파</span>`:`<span class="vs">${esc(challenge.n)}님까지 ${challenge.sc-sc+1}층 남았어요</span>`):'';
  show(`<div class="card">${head}<p style="margin:0">${nb?'신기록!':'이번 기록'}</p><div class="big">${sc}층</div><p>최고 ${best}층${STORE?'':' · 친구 중 '+myRank()+'위'}</p>
  ${continued?'':(STORE?'<button class="btn pri" data-a="cont">▶ 한 번 이어하기</button>':'<button class="btn pri" data-a="ad">▶ 광고 보고 이어하기</button>')}
  <button class="btn ${continued?'pri':'sec'}" data-a="again">${challenge&&sc<=challenge.sc?'복수전':'다시 하기'}</button>
  ${STORE?'':`<div class="row2"><button class="btn sec" data-a="send">도전장 보내기</button><button class="btn sec" data-a="rank2">순위 보기</button></div>`}</div>`);
}
function playAd(){
  state='ad';let n=3;
  const render=()=>show(`<div class="card ad"><span class="tag">광고 · 예시</span><h2>${n}</h2><p>실제 출시 버전에서는 이 자리에<br>토스 리워드 광고가 재생돼요.</p></div>`);
  render();const iv=setInterval(()=>{n--;if(n>0){render();return}clearInterval(iv);continued=true;spawn();hide();state='play';},1000);
}
ov.addEventListener('pointerdown',e=>e.stopPropagation());
ov.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
  if(a==='start'||a==='go')start();else if(a==='ad')playAd();else if(a==='cont'){continued=true;spawn();hide();state='play';}else if(a==='again'){reset();start();}
  else if(a==='rank')rankView('home');else if(a==='rank2')rankView('over');else if(a==='over')gameOver();
  else if(a==='home')ready();else if(a==='inbox')inbox();else if(a==='vs')vs(b.dataset.n,b.dataset.s);else if(a==='send')sent();});
box.addEventListener('pointerdown',e=>{if(state==='play'){e.preventDefault();drop();}});
window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){if(state==='play'){e.preventDefault();drop();}}});

ready();requestAnimationFrame(loop);
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
}
</script>
</body>
</html>
